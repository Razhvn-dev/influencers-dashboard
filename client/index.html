<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="shopify-api-key" content="__SHOPIFY_API_KEY__" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet" />
    <title>Influencer Dashboard</title>
    <script
      async
      src="https://cdn.shopify.com/shopifycloud/app-bridge.js"
      data-api-key="__SHOPIFY_API_KEY__"
      data-host="__SHOPIFY_HOST__"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function showStartupError(error) {
          var root = document.getElementById('root');
          if (!root || root.childNodes.length) return;

          root.innerHTML =
            '<main style="max-width:720px;margin:48px auto;padding:24px;font:16px/1.5 system-ui,sans-serif">' +
            '<h1 style="margin:0 0 12px">Influencer Dashboard could not start</h1>' +
            '<p style="margin:0;color:#5c5f62">' +
            String(error || 'Unknown frontend startup error').replace(/[&<>"']/g, function (character) {
              return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
            }) +
            '</p></main>';
        }

        // Resource-load failures (including a blocked module script) do not bubble,
        // so this listener must run during the capture phase.
        window.addEventListener('error', function (event) {
          showStartupError(event.message);
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          showStartupError(event.reason && event.reason.message ? event.reason.message : event.reason);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
